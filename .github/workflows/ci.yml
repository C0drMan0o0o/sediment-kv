name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.compiler.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: clang, cxx: clang++ }
          - { name: gcc, cxx: g++ }
    steps:
      - uses: actions/checkout@v4
      # CMakeLists.txt requires CMake 4.2+, newer than the runner's apt package.
      - name: Install CMake and Ninja
        run: pipx install cmake && pipx install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake and Ninja
        run: pipx install cmake && pipx install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DSEDIMENT_SANITIZE=address,undefined
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  lint:
    name: clang-format + clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ubuntu's own clang packages lag behind; install LLVM 23 from apt.llvm.org
      # so CI matches the version used locally.
      - name: Install tools
        run: |
          # apt.llvm.org is sometimes unreachable for a minute or more, so each
          # network step is retried up to 6 times, 30 s apart (~2.5 min). Each
          # failed attempt is shown as a warning annotation on the run.
          retry() {
            for attempt in 1 2 3 4 5 6; do
              "$@" && return 0
              echo "::warning::'$*' failed (attempt $attempt of 6)"
              if [ "$attempt" -lt 6 ]; then sleep 30; fi
            done
            return 1
          }
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          retry wget -nv -O llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          retry sudo ./llvm.sh 23
          retry sudo apt-get install -y clang-format-23 clang-tidy-23
          pipx install cmake && pipx install ninja
      - name: Format check
        run: git ls-files '*.h' '*.cpp' | xargs clang-format-23 --dry-run -Werror
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++-23 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
      - name: clang-tidy
        run: git ls-files 'src/*.cpp' 'tests/*.cpp' | xargs clang-tidy-23 -p build --quiet
