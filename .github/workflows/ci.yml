name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.compiler.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: clang, cxx: clang++ }
          - { name: gcc, cxx: g++ }
    steps:
      - uses: actions/checkout@v4
      # CMakeLists.txt requires CMake 4.2+, newer than the runner's apt package.
      - name: Install CMake and Ninja
        run: pipx install cmake && pipx install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake and Ninja
        run: pipx install cmake && pipx install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DSEDIMENT_SANITIZE=address,undefined
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  lint:
    name: clang-format + clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # clang-format and clang-tidy come from PyPI wheels pinned to the LLVM
      # version used locally, since formatting and checks change between
      # releases. apt.llvm.org was used before, but its host name often failed
      # to resolve from runners for minutes at a time. The clang-tidy wheel
      # ships clang's built-in headers, so it does not need a matching clang++.
      - name: Install tools
        run: |
          pipx install clang-format==23.1.3
          pipx install clang-tidy==23.1.3
          pipx install cmake && pipx install ninja
      - name: Format check
        run: git ls-files '*.h' '*.cpp' | xargs clang-format --dry-run -Werror
      # Configure only to produce compile_commands.json for clang-tidy; the
      # runner's own clang++ is enough for that.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
      - name: clang-tidy
        run: git ls-files 'src/*.cpp' 'tests/*.cpp' | xargs clang-tidy -p build --quiet
